name: Publish to PyPI

# Publishes the package to PyPI when a version tag (e.g. 0.2.0) is pushed, or
# when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API tokens or secrets required.
# One-time setup on PyPI: add a trusted publisher for this project pointing at
#   owner: grcarmenaty, repo: pymodal, workflow: publish-pypi.yml, environment: pypi
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish distribution to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pymodal
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
